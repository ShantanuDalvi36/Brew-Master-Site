openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ordering
    description: Table ordering operations
  - name: staff
    description: Staff order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /order-context:
    get:
      operationId: getOrderContext
      tags: [ordering]
      summary: Identify a table and start its active table session
      parameters:
        - name: table
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Active table session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderContext"
        "400":
          description: Invalid table number
  /orders:
    post:
      operationId: createDineInOrder
      tags: [ordering]
      summary: Create an individual customer order for a table session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid order
  /orders/{id}:
    get:
      operationId: getDineInOrder
      tags: [ordering]
      summary: Get one customer order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Customer order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
  /staff/orders:
    get:
      operationId: listStaffOrders
      tags: [staff]
      summary: List active table orders for staff
      responses:
        "200":
          description: Active orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffOrder"
  /staff/orders/{id}/status:
    patch:
      operationId: updateStaffOrderStatus
      tags: [staff]
      summary: Move an order to the next staff status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /staff/tables/{tableNumber}/session/close:
    post:
      operationId: closeTableSession
      tags: [staff]
      summary: Close the active session for a table
      parameters:
        - name: tableNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Closed table session
          content:
            application/json:
              schema:
                type: object
                required: [tableNumber, status]
                properties:
                  tableNumber: { type: integer }
                  status: { type: string }
        "404":
          description: Table not found
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Table:
      type: object
      required: [id, tableNumber, status]
      properties:
        id: { type: string }
        tableNumber: { type: integer }
        status: { type: string }
    TableSession:
      type: object
      required: [id, status, startedAt]
      properties:
        id: { type: string }
        status: { type: string }
        startedAt: { type: string, format: date-time }
    OrderContext:
      type: object
      required: [table, session]
      properties:
        table: { $ref: "#/components/schemas/Table" }
        session: { $ref: "#/components/schemas/TableSession" }
    Customization:
      type: object
      required: [size, milk, sweetness, extra, additionalPrice]
      properties:
        size: { type: string }
        milk: { type: string }
        sweetness: { type: string }
        extra: { type: string }
        additionalPrice: { type: number }
    CreateOrderItem:
      type: object
      required: [coffeeId, quantity, unitPrice, subtotal, customization]
      properties:
        coffeeId: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number }
        subtotal: { type: number }
        customization: { $ref: "#/components/schemas/Customization" }
    CreateOrderRequest:
      type: object
      required: [sessionId, tableNumber, customerName, phone, paymentMethod, items]
      properties:
        sessionId: { type: string }
        tableNumber: { type: integer }
        customerName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 3 }
        paymentMethod: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreateOrderItem" }
    OrderItemResponse:
      allOf:
        - $ref: "#/components/schemas/CreateOrderItem"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    OrderResponse:
      type: object
      required: [id, sessionId, tableNumber, customerName, phone, status, totalAmount, paymentMethod, createdAt, items]
      properties:
        id: { type: string }
        sessionId: { type: string }
        tableNumber: { type: integer }
        customerName: { type: string }
        phone: { type: string }
        status: { type: string }
        totalAmount: { type: number }
        paymentMethod: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItemResponse" }
    StaffOrder:
      type: object
      required: [id, tableNumber, customerName, status, totalAmount, createdAt]
      properties:
        id: { type: string }
        tableNumber: { type: integer }
        customerName: { type: string }
        status: { type: string }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Order Placed, Preparing, Ready, Served]

